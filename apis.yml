name: Skillbridge
description: 'Skillbridge (skillbridge.co) was a New York-based online marketplace for
  freelance consultants and independent professionals, connecting organizations from Fortune
  500 companies to early-stage startups with vetted specialists for short-term engagements.
  Founded in 2013, it was surfaced in the API Evangelist network as a 500 Global portfolio
  company. Skillbridge was acquired by Toptal in 2016 and folded into what became Toptal
  Business; the skillbridge.co domain now 301-redirects to toptal.com/finance. The company
  operates no independent developer API, documentation, developer portal, SDKs, or event
  surface, so there are no technical artifacts to enrich.'
